{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.84.0">
    <title>Signin Template · Bootstrap v5.0</title>





    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.css'%}">

    <!-- Favicons -->
    <link rel="apple-touch-icon" href="{% static 'img/sign in bootstrap/apple-touch-icon.png'%}" sizes="180x180">
    <link rel="icon" href="{% static 'img/sign in bootstrap/favicon-32x32.png'%}" sizes="32x32" type="image/png">
    <link rel="icon" href="{% static 'img/sign in bootstrap/favicon-16x16.png'%}" sizes="16x16" type="image/png">
    <link rel="manifest" href="{% static 'img/sign in bootstrap/manifest.json'%}">
    <link rel="mask-icon" href="{% static 'img/sign in bootstrap/safari-pinned-tab.svg'%}" color="#7952b3">
    <link rel="icon" href="{% static 'img/sign in bootstrap/favicon.ico'%}">
    <meta name="theme-color" content="#7952b3">

    <style>
        .bd-placeholder-img {
            font-size: 1.125rem;
            text-anchor: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        @media (min-width: 768px) {
            .bd-placeholder-img-lg {
                font-size: 3.5rem;
            }
        }
    </style>


    <!-- Custom styles for this template -->
    <link rel="stylesheet" href="{% static 'css/bootstrap/bootstrap.css'%}">

</head>

<body class="text-center">

    <main class="form-signin">
        <form class="form-single" method="post" action="{% url 'user_account:login' %}">
            {% csrf_token %}
            <img class="mb-4" src="{%static 'img/sign in bootstrap/bootstrap-logo.svg' %}" alt="40" width="72"
                height="57">
            <h1 class="h3 mb-3 fw-normal">Loging</h1>
            {{form.as_p}}
            <div class="checkbox mb-3">
                <label>
                    <input type="checkbox" value="remember-me"> Remember me
                </label>
            </div>
            <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
            <p class="mt-5 mb-3 text-muted">&copy; 2017–2021</p>
        </form>
    </main>


</body>

</html>
